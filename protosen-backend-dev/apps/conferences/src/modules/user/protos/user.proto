syntax = "proto3";

package users;

import "google/protobuf/empty.proto";

service UserService {
  rpc GetUserByToken(TokenRequest) returns (User);
  rpc GetUsersByIds(IdsRequest) returns (UsersResponse);
  rpc GetUser(UserRequest) returns (UserResponse);
}

message TokenRequest {
  string token = 1;
}

message User {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;
  string role = 6;
  optional string verification_code = 7;
  optional int64 verification_code_ttl = 8;
  string status = 9;
  bool confirmed = 10;
  bool deleted = 11;
  string organism_id = 12;
  string access_group_id = 13;
  Institution organism = 14;
  AccessGroup access_group = 15;
}

message IdsRequest {
  repeated string ids = 1;
}

message UserRequest {
  optional string id = 1;
  optional string email = 2;
}

message UsersResponse {
  repeated User users = 1;
}

message UserResponse {
  User user = 1;
}

message AccessGroup {
  string id = 1;
  string name = 2;
  repeated string permissions = 3;
}

message Institution {
  string id = 1;
  string institution_type = 2;
  string code = 3;
  string libelle = 4;
  string service = 5;
  string status = 6;
}
