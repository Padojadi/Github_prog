tags:
  - name: Cards - Other Staff
    description: Gestion des cartes diplomatiques pour autre personnel

paths:
  /api/card/other-staff:
    post:
      tags:
        - Cards - Other Staff
      summary: Créer une nouvelle carte autre personnel
      description: Crée une nouvelle demande de carte pour autre personnel
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOtherStaffCardInput'
      responses:
        '200':
          description: Carte créée avec succès
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    get:
      tags:
        - Cards - Other Staff
      summary: Obtenir toutes les cartes autre personnel
      description: Récupère la liste avec filtres
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Liste récupérée
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/card/other-staff/files:
    post:
      tags:
        - Cards - Other Staff
      summary: Attacher les fichiers initiaux
      description: Upload initial (passport, attestation de dépendance, photo)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - otherStaffDiplomaticCardId
                - passport
                - ad
                - photo
              properties:
                otherStaffDiplomaticCardId:
                  type: string
                  format: uuid
                passport:
                  type: string
                  format: binary
                ad:
                  type: string
                  format: binary
                  description: Attestation de dépendance
                photo:
                  type: string
                  format: binary
                others:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Fichiers attachés
        '405':
          description: Fichiers déjà attachés

    put:
      tags:
        - Cards - Other Staff
      summary: Mettre à jour les fichiers
      description: Met à jour les fichiers existants
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - otherStaffDiplomaticCardId
              properties:
                otherStaffDiplomaticCardId:
                  type: string
                  format: uuid
                passport:
                  type: string
                  format: binary
                ad:
                  type: string
                  format: binary
                photo:
                  type: string
                  format: binary
                others:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Fichiers mis à jour

  /api/card/other-staff/files/other/delete/{id}:
    patch:
      tags:
        - Cards - Other Staff
      summary: Supprimer des fichiers additionnels
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileKeys
              properties:
                fileKeys:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Fichiers supprimés

  /api/card/other-staff/pointfocal/validate/{id}:
    put:
      tags:
        - Cards - Other Staff
      summary: Validation point focal
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Carte soumise

  /api/card/other-staff/admin/validate/{id}:
    put:
      tags:
        - Cards - Other Staff
      summary: Validation admin
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - documentStage
              properties:
                documentStage:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Validation effectuée

  /api/card/other-staff/superadmin/validate/{id}:
    put:
      tags:
        - Cards - Other Staff
      summary: Validation super admin
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - documentStage
              properties:
                documentStage:
                  type: string
                validUntil:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Validation effectuée

  /api/card/other-staff/set-printed/{id}:
    patch:
      tags:
        - Cards - Other Staff
      summary: Marquer comme imprimée
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Carte imprimée

  /api/card/other-staff/undo-print/{id}:
    patch:
      tags:
        - Cards - Other Staff
      summary: Annuler l'impression
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Impression annulée

  /api/card/other-staff/set-returned/{id}:
    patch:
      tags:
        - Cards - Other Staff
      summary: Marquer une carte comme restituée
      description: Change le statut d'une carte imprimée à RETURNED (Admin/SuperAdmin uniquement)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Carte marquée comme restituée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: La carte doit être imprimée et non expirée
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Carte non trouvée

  /api/card/other-staff/{id}:
    get:
      tags:
        - Cards - Other Staff
      summary: Obtenir une carte par ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Carte récupérée

    patch:
      tags:
        - Cards - Other Staff
      summary: Mettre à jour partiellement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOtherStaffCardInput'
      responses:
        '200':
          description: Carte mise à jour

    delete:
      tags:
        - Cards - Other Staff
      summary: Supprimer une carte
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Carte supprimée

  # Routes renouvellement
  /api/card/other-staff/renew:
    get:
      tags:
        - Cards - Other Staff
      summary: Liste des renouvellements
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Liste récupérée

  /api/card/other-staff/renew/create/{id}:
    post:
      tags:
        - Cards - Other Staff
      summary: Créer un renouvellement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Renouvellement créé

  /api/card/other-staff/renew/pointfocal/validate/{id}:
    put:
      tags:
        - Cards - Other Staff
      summary: Validation point focal (renouvellement)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Soumis

  /api/card/other-staff/renew/admin/validate/{id}:
    put:
      tags:
        - Cards - Other Staff
      summary: Validation admin (renouvellement)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Validé

  /api/card/other-staff/renew/superadmin/validate/{id}:
    put:
      tags:
        - Cards - Other Staff
      summary: Validation super admin (renouvellement)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Validé

  /api/card/other-staff/renew/set-printed/{id}:
    patch:
      tags:
        - Cards - Other Staff
      summary: Marquer renouvellement comme imprimé
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marqué imprimé

  /api/card/other-staff/renew/undo-print/{id}:
    patch:
      tags:
        - Cards - Other Staff
      summary: Annuler impression renouvellement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Annulé

  /api/card/other-staff/renew/set-returned/{id}:
    patch:
      tags:
        - Cards - Other Staff
      summary: Marquer un renouvellement comme restitué
      description: Change le statut d'un renouvellement imprimé à RETURNED (Admin/SuperAdmin uniquement)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Renouvellement marqué comme restitué
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: Le renouvellement doit être imprimé et non expiré
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Renouvellement non trouvé

  /api/card/other-staff/renew/{id}:
    get:
      tags:
        - Cards - Other Staff
      summary: Obtenir un renouvellement par ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Renouvellement récupéré

  # Routes duplicata
  /api/card/other-staff/duplicata:
    post:
      tags:
        - Cards - Other Staff
      summary: Demander un duplicata
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Duplicata créé

    get:
      tags:
        - Cards - Other Staff
      summary: Liste des duplicatas
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Liste récupérée

  /api/card/other-staff/duplicata/{id}:
    get:
      tags:
        - Cards - Other Staff
      summary: Obtenir un duplicata par ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Duplicata récupéré

  /api/card/other-staff/duplicata/pointfocal/validate/{id}:
    put:
      tags:
        - Cards - Other Staff
      summary: Validation point focal (duplicata)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Soumis

  /api/card/other-staff/duplicata/admin/validate/{id}:
    put:
      tags:
        - Cards - Other Staff
      summary: Validation admin (duplicata)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Validé

  /api/card/other-staff/duplicata/superadmin/validate/{id}:
    put:
      tags:
        - Cards - Other Staff
      summary: Validation super admin (duplicata)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Validé

  /api/card/other-staff/duplicata/set-printed/{id}:
    patch:
      tags:
        - Cards - Other Staff
      summary: Marquer un duplicata comme imprimé
      description: Change le statut du duplicata à PRINTED avec les détails d'impression
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - issueDate
                - validUntil
                - type_card
                - color
              properties:
                issueDate:
                  type: string
                  format: date
                  description: Date d'émission de la carte
                validUntil:
                  type: string
                  format: date
                  description: Date d'expiration de la carte
                type_card:
                  type: string
                  description: Type de carte
                color:
                  type: string
                  description: Couleur de la carte
                plaque:
                  type: string
                  maxLength: 4
                  description: Numéro de plaque (optionnel, max 4 caractères)
                observation:
                  type: string
                  nullable: true
                  description: Observations additionnelles (optionnel)
      responses:
        '200':
          description: Duplicata marqué comme imprimé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: La carte ne peut pas être imprimée (pas en statut CONFIRMED ou carte originale expirée)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Duplicata non trouvé

  /api/card/other-staff/duplicata/undo-print/{id}:
    patch:
      tags:
        - Cards - Other Staff
      summary: Annuler l'impression d'un duplicata
      description: Retourne un duplicata imprimé au statut CONFIRMED (SuperAdmin uniquement)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Impression du duplicata annulée avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: L'impression ne peut pas être annulée (pas en statut PRINTED ou carte originale expirée)
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Duplicata non trouvé

  /api/card/other-staff/duplicata/set-returned/{id}:
    patch:
      tags:
        - Cards - Other Staff
      summary: Marquer un duplicata comme restitué
      description: Change le statut d'un duplicata imprimé à RETURNED (Admin/SuperAdmin uniquement)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Duplicata marqué comme restitué
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: Le duplicata doit être imprimé et la carte originale non expirée
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Duplicata non trouvé

components:
  schemas:
    CreateOtherStaffCardInput:
      type: object
      required:
        - firstName
        - lastName
        - gender
        - dateOfBirth
        - ownerDiplomaticCardId
      properties:
        firstName:
          type: string
        lastName:
          type: string
        gender:
          type: string
          enum: [M, F]
        dateOfBirth:
          type: string
          format: date-time
        ownerDiplomaticCardId:
          type: string
          format: uuid

    UpdateOtherStaffCardInput:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
