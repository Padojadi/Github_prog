tags:
  - name: Cards - Child
    description: Gestion des cartes diplomatiques pour enfants

paths:
  /api/card/child:
    post:
      tags:
        - Cards - Child
      summary: Créer une nouvelle carte enfant
      description: Crée une nouvelle demande de carte diplomatique pour un enfant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildCardInput'
      responses:
        '200':
          description: Carte créée avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  demandType:
                    type: string
                    example: NEW
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ChildCard'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: Erreur serveur

    get:
      tags:
        - Cards - Child
      summary: Obtenir toutes les cartes enfant
      description: Récupère la liste de toutes les cartes enfant avec filtres
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disabled]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          schema:
            type: string
        - name: documentStage
          in: query
          schema:
            type: string
        - name: organismId
          in: query
          schema:
            type: string
        - name: creatorId
          in: query
          schema:
            type: string
        - name: id
          in: query
          schema:
            type: string
        - name: expired
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Liste des cartes récupérée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      cards:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChildCard'
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/card/child/files:
    post:
      tags:
        - Cards - Child
      summary: Attacher les fichiers initiaux
      description: Upload initial des fichiers requis (passport, acte de naissance, photo) pour une carte. Cette route doit être utilisée la première fois uniquement.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - childDiplomaticCardId
                - passport
                - an
                - photo
              properties:
                childDiplomaticCardId:
                  type: string
                  format: uuid
                  description: ID de la carte diplomatique de l'enfant
                passport:
                  type: string
                  format: binary
                  description: Fichier du passeport (requis)
                an:
                  type: string
                  format: binary
                  description: Acte de naissance (requis)
                photo:
                  type: string
                  format: binary
                  description: Photo d'identité (requis)
                others:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Fichiers additionnels (optionnel)
      responses:
        '200':
          description: Fichiers attachés avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: Fichiers manquants ou invalides
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '405':
          description: Les fichiers ont déjà été attachés

    put:
      tags:
        - Cards - Child
      summary: Mettre à jour ou ajouter des fichiers
      description: Met à jour les fichiers existants (passport, acte de naissance, photo) ou ajoute des fichiers additionnels
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - childDiplomaticCardId
              properties:
                childDiplomaticCardId:
                  type: string
                  format: uuid
                  description: ID de la carte diplomatique de l'enfant
                passport:
                  type: string
                  format: binary
                  description: Nouveau fichier du passeport (optionnel)
                an:
                  type: string
                  format: binary
                  description: Nouvel acte de naissance (optionnel)
                photo:
                  type: string
                  format: binary
                  description: Nouvelle photo d'identité (optionnel)
                others:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Fichiers additionnels à ajouter (optionnel)
      responses:
        '200':
          description: Fichiers mis à jour avec succès
        '400':
          description: Requête invalide
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Carte ou fichiers non trouvés

  /api/card/child/files/other/delete/{id}:
    patch:
      tags:
        - Cards - Child
      summary: Supprimer des fichiers additionnels
      description: Supprime un ou plusieurs fichiers de la liste 'others'
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileKeys
              properties:
                fileKeys:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Fichiers supprimés
        '404':
          description: Carte non trouvée

  /api/card/child/pointfocal/validate/{id}:
    put:
      tags:
        - Cards - Child
      summary: Validation point focal
      description: Soumettre une carte pour validation au niveau point focal
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Carte soumise pour validation
        '400':
          description: La carte ne peut pas être mise à jour
        '404':
          description: Carte non trouvée

  /api/card/child/admin/validate/{id}:
    put:
      tags:
        - Cards - Child
      summary: Validation admin
      description: Valider ou rejeter une carte au niveau admin
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - documentStage
              properties:
                documentStage:
                  type: string
                  enum: [PENDING, APPROVED, REJECTED, CONFIRMED, PRINTED]
                reason:
                  type: string
      responses:
        '200':
          description: Validation effectuée
        '400':
          description: Validation impossible
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/card/child/superadmin/validate/{id}:
    put:
      tags:
        - Cards - Child
      summary: Validation super admin
      description: Validation finale par le super admin avec génération du numéro de carte
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - documentStage
              properties:
                documentStage:
                  type: string
                  enum: [APPROVED, REJECTED, CONFIRMED]
                validUntil:
                  type: string
                  format: date-time
                reason:
                  type: string
      responses:
        '200':
          description: Validation super admin effectuée
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/card/child/set-printed/{id}:
    patch:
      tags:
        - Cards - Child
      summary: Marquer une carte comme imprimée
      description: Change le statut d'une carte à PRINTED
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                printedDate:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Carte marquée comme imprimée

  /api/card/child/undo-print/{id}:
    patch:
      tags:
        - Cards - Child
      summary: Annuler l'impression d'une carte
      description: Retourne une carte imprimée au statut CONFIRMED (SuperAdmin uniquement)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Impression annulée
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/card/child/set-returned/{id}:
    patch:
      tags:
        - Cards - Child
      summary: Marquer une carte comme restituée
      description: Change le statut d'une carte imprimée à RETURNED (Admin/SuperAdmin uniquement)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Carte marquée comme restituée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: La carte doit être imprimée et non expirée
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Carte non trouvée

  /api/card/child/{id}:
    get:
      tags:
        - Cards - Child
      summary: Obtenir une carte par ID
      description: Récupère les détails d'une carte enfant avec ses fichiers
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Carte récupérée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ChildCard'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags:
        - Cards - Child
      summary: Mettre à jour partiellement une carte
      description: Mise à jour partielle des informations de la carte
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChildCardInput'
      responses:
        '200':
          description: Carte mise à jour
        '400':
          description: Mise à jour impossible
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Cards - Child
      summary: Supprimer une carte
      description: Supprime une carte et ses fichiers associés (SuperAdmin uniquement)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Carte supprimée
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Routes de renouvellement
  /api/card/child/renew:
    get:
      tags:
        - Cards - Child
      summary: Obtenir les demandes de renouvellement
      description: Liste toutes les demandes de renouvellement
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Liste des renouvellements

  /api/card/child/renew/create/{id}:
    post:
      tags:
        - Cards - Child
      summary: Créer une demande de renouvellement
      description: Crée une nouvelle demande de renouvellement pour une carte existante
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la carte originale à renouveler
      responses:
        '200':
          description: Demande de renouvellement créée
        '400':
          description: Renouvellement impossible
        '404':
          description: Carte originale non trouvée

  /api/card/child/renew/pointfocal/validate/{id}:
    put:
      tags:
        - Cards - Child
      summary: Validation point focal (renouvellement)
      description: Soumettre un renouvellement pour validation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Renouvellement soumis

  /api/card/child/renew/admin/validate/{id}:
    put:
      tags:
        - Cards - Child
      summary: Validation admin (renouvellement)
      description: Valider ou rejeter un renouvellement au niveau admin
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - documentStage
              properties:
                documentStage:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Validation effectuée

  /api/card/child/renew/superadmin/validate/{id}:
    put:
      tags:
        - Cards - Child
      summary: Validation super admin (renouvellement)
      description: Validation finale du renouvellement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - documentStage
              properties:
                documentStage:
                  type: string
                validUntil:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Renouvellement validé

  /api/card/child/renew/set-printed/{id}:
    patch:
      tags:
        - Cards - Child
      summary: Marquer un renouvellement comme imprimé
      description: Change le statut du renouvellement à PRINTED
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                printedDate:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Renouvellement marqué comme imprimé

  /api/card/child/renew/undo-print/{id}:
    patch:
      tags:
        - Cards - Child
      summary: Annuler l'impression d'un renouvellement
      description: Retourne un renouvellement au statut CONFIRMED
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Impression annulée

  /api/card/child/renew/set-returned/{id}:
    patch:
      tags:
        - Cards - Child
      summary: Marquer un renouvellement comme restitué
      description: Change le statut d'un renouvellement imprimé à RETURNED (Admin/SuperAdmin uniquement)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Renouvellement marqué comme restitué
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: Le renouvellement doit être imprimé et non expiré
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Renouvellement non trouvé

  /api/card/child/renew/{id}:
    get:
      tags:
        - Cards - Child
      summary: Obtenir un renouvellement par ID
      description: Récupère les détails d'une demande de renouvellement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Renouvellement récupéré
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Routes de duplicata
  /api/card/child/duplicata:
    post:
      tags:
        - Cards - Child
      summary: Demander un duplicata
      description: Crée une demande de duplicata pour une carte existante
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - childDiplomaticCardId
              properties:
                childDiplomaticCardId:
                  type: string
                  format: uuid
                reason:
                  type: string
      responses:
        '200':
          description: Demande de duplicata créée
        '400':
          description: Duplicata impossible

    get:
      tags:
        - Cards - Child
      summary: Obtenir les demandes de duplicata
      description: Liste toutes les demandes de duplicata
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Liste des duplicatas

  /api/card/child/duplicata/{id}:
    get:
      tags:
        - Cards - Child
      summary: Obtenir un duplicata par ID
      description: Récupère les détails d'une demande de duplicata
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Duplicata récupéré
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/card/child/duplicata/pointfocal/validate/{id}:
    put:
      tags:
        - Cards - Child
      summary: Validation point focal (duplicata)
      description: Soumettre un duplicata pour validation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Duplicata soumis

  /api/card/child/duplicata/admin/validate/{id}:
    put:
      tags:
        - Cards - Child
      summary: Validation admin (duplicata)
      description: Valider ou rejeter un duplicata au niveau admin
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - documentStage
              properties:
                documentStage:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Validation effectuée

  /api/card/child/duplicata/superadmin/validate/{id}:
    put:
      tags:
        - Cards - Child
      summary: Validation super admin (duplicata)
      description: Validation finale du duplicata
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - documentStage
              properties:
                documentStage:
                  type: string
                validUntil:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Duplicata validé

  /api/card/child/duplicata/set-printed/{id}:
    patch:
      tags:
        - Cards - Child
      summary: Marquer un duplicata comme imprimé
      description: Change le statut du duplicata à PRINTED avec les détails d'impression
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - issueDate
                - validUntil
                - type_card
                - color
              properties:
                issueDate:
                  type: string
                  format: date
                  description: Date d'émission de la carte
                validUntil:
                  type: string
                  format: date
                  description: Date d'expiration de la carte
                type_card:
                  type: string
                  description: Type de carte
                color:
                  type: string
                  description: Couleur de la carte
                plaque:
                  type: string
                  maxLength: 4
                  description: Numéro de plaque (optionnel, max 4 caractères)
                observation:
                  type: string
                  nullable: true
                  description: Observations additionnelles (optionnel)
      responses:
        '200':
          description: Duplicata marqué comme imprimé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: La carte ne peut pas être imprimée (pas en statut CONFIRMED ou carte originale expirée)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Duplicata non trouvé

  /api/card/child/duplicata/undo-print/{id}:
    patch:
      tags:
        - Cards - Child
      summary: Annuler l'impression d'un duplicata
      description: Retourne un duplicata imprimé au statut CONFIRMED (SuperAdmin uniquement)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Impression du duplicata annulée avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: L'impression ne peut pas être annulée (pas en statut PRINTED ou carte originale expirée)
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Duplicata non trouvé

  /api/card/child/duplicata/set-returned/{id}:
    patch:
      tags:
        - Cards - Child
      summary: Marquer un duplicata comme restitué
      description: Change le statut d'un duplicata imprimé à RETURNED (Admin/SuperAdmin uniquement)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Duplicata marqué comme restitué
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: Le duplicata doit être imprimé et la carte originale non expirée
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Duplicata non trouvé

components:
  schemas:
    CreateChildCardInput:
      type: object
      required:
        - title
        - firstName
        - lastName
        - gender
        - dateOfBirth
        - placeOfBirth
        - citizenship
        - countryOfBirth
        - travellingNumber
        - deliverThe
        - deliverBy
        - deliverAt
        - travellingTitleType
        - travellingTitleValidUntil
        - ownerDiplomaticCardId
      properties:
        title:
          type: string
          maxLength: 200
          example: M.
        firstName:
          type: string
          maxLength: 200
          example: Pierre
        lastName:
          type: string
          maxLength: 200
          example: Dupont
        email:
          type: string
          format: email
          maxLength: 100
